[project]
name = "voice-rag-agent"
version = "0.1.0"
description = "Bilingual voice agent that answers from the FastAPI docs, with a live trace of every step"
authors = [
    { name = "Ronaldo Ruiz", email = "72892802+RonaldoJ24@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.17.0",
    "boto3>=1.43.116",
    "fastapi>=0.156.4",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
